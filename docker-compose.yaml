services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "25301:5001"
    environment:
      - NEO4J_URI=neo4j://gram_test:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - minegraph-network

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "25302:80"
    environment:
      - BASE_PATH=/gram
    depends_on:
      - backend
    networks:
      - minegraph-network

networks:
  minegraph-network:
    external: true
